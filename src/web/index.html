<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-clik</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
	<header id="topbar">
		<span id="brand">pi-clik</span>
		<span id="model-name"></span>
		<span id="status" role="status"></span>
		<button id="settings-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
	</header>
	<div id="settings-panel" hidden>
		<label><input type="checkbox" id="toggle-chips" checked /> Suggestion chips</label>
		<label><input type="checkbox" id="toggle-hotkeys" checked /> Alt+1…9,0 hotkeys</label>
	</div>
	<main id="messages" aria-live="polite"></main>
	<footer id="composer-bar">
		<textarea id="composer" rows="3" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
		<div id="composer-buttons">
			<button id="abort-btn" type="button" hidden>Stop</button>
			<button id="send-btn" type="button">Send</button>
		</div>
	</footer>
	<span id="chip-hint" hidden>inserts this text into your message</span>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
